name: Update Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Nightly at 2am PT (10am UTC)

permissions:
  contents: write

jobs:
  get-packages:
    name: Get package list
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: giopkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Get package list
        id: get-packages
        run: |
          packages=$(nix develop .#update --command nu scripts/list-active.nu)
          echo "packages=$packages" >> $GITHUB_OUTPUT

  update-packages:
    name: Update ${{ matrix.package }}
    needs: [get-packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.get-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: giopkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update ${{ matrix.package }}
        env:
          # Without this, `gh api` runs unauthenticated at 60 requests/hour from
          # an IP shared with every other Actions runner.
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#update --command nu scripts/update-package.nu "${{ matrix.package }}"

      - name: Upload package updates
        uses: actions/upload-artifact@v4
        with:
          name: package-updates-${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}.nix
            packages/${{ matrix.package }}/
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload failure marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-failures-${{ matrix.package }}
          path: update-failures/
          if-no-files-found: ignore

      # Carries the version pair and the pass/fail status to the commit loop.
      # Written unconditionally, so a missing file is a bug rather than an
      # expected empty case.
      - name: Upload update metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-meta-${{ matrix.package }}
          path: update-meta/
          if-no-files-found: error

  prepare-for-build:
    name: Prepare changes for build
    needs: [update-packages]
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: giopkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Download all package updates
        uses: actions/download-artifact@v4
        with:
          pattern: package-updates-*
          path: packages/
          merge-multiple: true

      - name: Download update metadata
        uses: actions/download-artifact@v4
        with:
          pattern: update-meta-*
          path: update-meta/
          merge-multiple: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Created before the commit loop runs so the script stays branch-agnostic
      # and can be exercised locally. Never pushed when nothing was committed.
      - name: Create temp branch
        run: git checkout -b auto-update-${{ github.run_id }}

      - name: Commit each update
        id: check-changes
        run: nix develop .#update --command nu scripts/commit-updates.nu

      - name: Push temp branch
        if: steps.check-changes.outputs.has_changes == 'true'
        run: git push origin auto-update-${{ github.run_id }}

  verify-and-push:
    name: Verify and push to main
    needs: prepare-for-build
    if: needs.prepare-for-build.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-update-${{ github.run_id }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: giopkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run flake check
        run: nix develop .#update --command nu scripts/check.nu

      - name: Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main

      - name: Delete temp branch
        run: git push origin --delete auto-update-${{ github.run_id }}

  # update-package.nu deliberately never fails its own job, so one broken
  # upstream cannot stop the other packages from being committed. This job
  # exists so those failures are still visible: a package that silently stops
  # updating went unnoticed for months before it was added.
  report-update-failures:
    name: Report update failures
    needs: [update-packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download failure markers
        uses: actions/download-artifact@v4
        with:
          pattern: update-failures-*
          path: update-failures/
          merge-multiple: true

      - name: Fail if any package failed to update
        run: |
          shopt -s nullglob
          logs=(update-failures/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "All packages updated cleanly."
            exit 0
          fi
          echo "### Packages that failed to update" >> "$GITHUB_STEP_SUMMARY"
          for log in "${logs[@]}"; do
            name=$(basename "$log" .log)
            echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::group::$name"; cat "$log"; echo "::endgroup::"
          done
          exit 1
