name: Update Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Nightly at 2am PT (10am UTC)

permissions:
  contents: write

jobs:
  get-packages:
    name: Get package list
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: giopkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Get package list
        id: get-packages
        run: |
          packages=$(./scripts/list-packages.sh)
          echo "packages=$packages" >> $GITHUB_OUTPUT

  update-packages:
    name: Update ${{ matrix.package }}
    needs: [get-packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.get-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: giopkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Install nix-update
        run: nix profile install nixpkgs#nix-update

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update ${{ matrix.package }}
        run: ./scripts/update-package.sh "${{ matrix.package }}"

      - name: Upload package updates
        uses: actions/upload-artifact@v4
        with:
          name: package-updates-${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}.nix
            packages/${{ matrix.package }}/
          if-no-files-found: ignore
          include-hidden-files: true

  prepare-for-build:
    name: Prepare changes for build
    needs: [update-packages]
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all package updates
        uses: actions/download-artifact@v4
        with:
          pattern: package-updates-*
          path: packages/
          merge-multiple: true

      - name: Check for changes
        id: check-changes
        run: |
          git add packages/ || true

          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit to temp branch
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b auto-update-${{ github.run_id }}
          git commit -m "chore: update packages"
          git push origin auto-update-${{ github.run_id }}

  verify-and-push:
    name: Verify and push to main
    needs: prepare-for-build
    if: needs.prepare-for-build.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-update-${{ github.run_id }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: giopkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run flake check
        run: nix flake check

      - name: Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main

      - name: Delete temp branch
        run: git push origin --delete auto-update-${{ github.run_id }}
