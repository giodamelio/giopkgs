name: Update Flake and Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC

permissions:
  contents: write

jobs:
  update-flake:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check flake
        uses: DeterminateSystems/flake-checker-action@main
        with:
          send-statistics: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update flake.lock
        run: nix flake update

      - name: Upload changes
        uses: actions/upload-artifact@v4
        with:
          name: flake-updates
          path: flake.lock

  get-packages:
    name: Get package list
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Get package list
        id: get-packages
        run: |
          packages=$(nix flake show --json | jq -c '.packages."x86_64-linux" | keys')
          echo "packages=$packages" >> $GITHUB_OUTPUT

  update-packages:
    name: Update ${{ matrix.package }}
    needs: [update-flake, get-packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.get-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install nix-update
        run: nix profile install nixpkgs#nix-update

      - name: Download flake updates
        uses: actions/download-artifact@v4
        with:
          name: flake-updates

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update ${{ matrix.package }}
        run: |
          # Check if package has a custom update script
          if script_path=$(nix eval --raw ".#${{ matrix.package }}.updateScript" 2>/dev/null); then
            echo "Running custom update script for ${{ matrix.package }}..."
            "$script_path" || echo "Update failed for ${{ matrix.package }}"
          else
            echo "Using default nix-update for ${{ matrix.package }}..."
            nix-update --flake ${{ matrix.package }} || echo "No update available or update failed for ${{ matrix.package }}"
          fi

      - name: Upload package updates
        uses: actions/upload-artifact@v4
        with:
          name: package-updates-${{ matrix.package }}
          path: packages/${{ matrix.package }}/

  prepare-for-build:
    name: Prepare changes for build
    needs: [update-flake, update-packages]
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Download flake updates
        uses: actions/download-artifact@v4
        with:
          name: flake-updates

      - name: Download all package updates
        uses: actions/download-artifact@v4
        with:
          pattern: package-updates-*
          path: packages/
          merge-multiple: true

      - name: Check for changes
        id: check-changes
        run: |
          git add flake.lock packages/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit to temp branch
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b auto-update-${{ github.run_id }}
          git commit -m "chore: update flake dependencies and packages"
          git push origin auto-update-${{ github.run_id }}

  build-updated-packages:
    name: Build updated packages
    needs: prepare-for-build
    if: needs.prepare-for-build.outputs.has_changes == 'true'
    uses: ./.github/workflows/build.yml

  verify-and-push:
    name: Verify and push to main
    needs: [prepare-for-build, build-updated-packages]
    if: needs.prepare-for-build.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-update-${{ github.run_id }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Run flake check
        run: nix flake check

      - name: Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin auto-update-${{ github.run_id }}:main

      - name: Delete temp branch
        run: git push origin --delete auto-update-${{ github.run_id }}
